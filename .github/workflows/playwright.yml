name: Playwright Tests

on:
  # Quality gate for every change landing on master.
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Weekly full run: Mondays at 15:00 Argentina time (America/Argentina/Buenos_Aires, UTC-3,
  # no DST). GitHub cron runs in UTC, so 15:00 ART = 18:00 UTC.
  schedule:
    - cron: '0 18 * * 1'
  # Manual trigger (`gh workflow run playwright.yml`).
  workflow_dispatch:

# The job only reads the repository; artifacts do not need extra scopes.
permissions:
  contents: read

# One run per branch at a time; a newer push cancels the run still in flight.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck and test (UI + API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Only the ui-chromium project needs a browser; --with-deps pulls the OS libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs both projects (api + ui-chromium). The api project rewrites the happy-path
      # bodies under resource/api when the upstream contract changed.
      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results (traces, videos, json, junit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload happy-path JSON contracts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: happy-path-json
          path: resource/api/*.json
          retention-days: 90
          if-no-files-found: error
